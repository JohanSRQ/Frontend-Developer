<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors 3</title>
    <style>
        p {
            color: salmon;
        }

        p::first-letter {
            color: skyblue;
        }

        p::before {
            content: '⭐' ;
        }
        
        p::after {
            content: '👾'  ;
        }

        p:hover {
            color: rebeccapurple;
        }

        div p:nth-child(2) {
            background: aqua;
        }

        ::placeholder {
            color: tomato;
        }
    </style>
</head>
<body>
    <p>Hola</p>
    <div>
        <p>Platzi</p>
        <p>Master</p>
        <p>Lo mejor</p>
    </div>
    <input type="text" placeholder="Escribe algo...">
</body>
</html>
